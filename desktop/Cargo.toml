[package]
name = "curator-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Curator Host native media library"
publish = false
default-run = "Curator"

[[bin]]
name = "Curator"
path = "src/main.rs"

[build-dependencies]
# Build-time compiler and runtime must stay on the same Slint release because
# generated component ABI is not guaranteed across Slint versions.
slint-build = "=1.18.0"

[dependencies]
curator = { path = ".." }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# Keep exactly aligned with slint-build above.
slint = "=1.18.0"
rfd = "0.16"
tempfile = "3"
libloading = "0.8"
