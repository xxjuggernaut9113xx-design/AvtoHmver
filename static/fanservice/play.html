<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151c27"><title>fanservice Viewer+</title><script src="media.js"></script><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="kenney.css"><link rel="stylesheet" href="presentation.css"><link rel="stylesheet" href="play.css"></head><body>
<header><strong>fanservice Viewer+</strong><a href="index.html">Library import</a><span id="source"></span></header><main>
  <section id="gameplay" aria-label="Gameplay">
    <div id="stage"><img id="image" alt="Selected pack media"><video id="video" playsinline muted loop hidden></video></div>
    <div id="beats"><span id="center"></span><span id="beat"></span></div>
    <div id="controls"><button id="start">Start</button><button id="pause" disabled>Pause</button><button id="tap" disabled>Draw / Space</button><button id="draw" disabled>Next media</button><button id="finish" aria-keyshortcuts="Enter Space" disabled>Hold to finish</button><button id="end">End session</button></div>
  </section>
  <p id="caption" aria-live="polite"></p>
  <p id="voice-status" role="status"></p>
  <p id="status" role="status">Preparing local gameplay…</p>
  <progress id="meter" max="1" value="0" aria-label="Session meter"></progress>
  <details id="session-statistics">
    <summary>Detailed statistics</summary>
    <p id="stats"></p>
    <p id="background-status">Background: Normal procedural preset.</p>
  </details>
  <audio id="audio" preload="metadata" hidden></audio>
  <label>Difficulty<select id="difficulty"><option value="0">Easy</option><option value="1" selected>Normal</option><option value="2">Insane</option></select></label>
  <label>Media pool<select id="pool"><option>slow</option><option>medium</option><option>fast</option><option>succubus</option><option>cum</option><option>ass</option><option>boobs</option></select></label>
  <pre id="summary"></pre>
</main>
<script src="store.js"></script><script src="model.js"></script><script src="rules.js"></script><script src="inventory.js"></script><script src="items.js"></script><script src="objectives.js"></script><script src="tower.js"></script><script src="modifiers.js"></script><script src="economy.js"></script><script src="cards.js"></script><script src="edge.js"></script><script src="run.js"></script><script src="progression.js"></script><script src="voice.js"></script><script src="background.js"></script><script src="vibration.js"></script><script src="play.js"></script></body></html>
