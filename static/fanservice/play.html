<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151c27"><title>fanservice Viewer+</title><script src="media.js"></script><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="kenney.css"><link rel="stylesheet" href="presentation.css"><style>
body{padding-bottom:20px}#stage{position:relative;min-height:50dvh;background:radial-gradient(ellipse at bottom,#254b4d,#101722 70%);overflow:hidden;border-radius:12px}#stage img,#stage video{display:block;width:100%;height:55dvh;object-fit:contain}#beats{height:50px;position:relative;background:linear-gradient(90deg,#202c40,#35675b,#202c40);overflow:hidden}#center{position:absolute;left:50%;height:100%;width:3px;background:#fff}#beat{position:absolute;top:12px;width:24px;height:24px;border-radius:50%;background:#c8ef97;box-shadow:0 0 18px #b5ff8a}progress{width:100%;height:22px}#controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}#audio{width:100%}#summary{white-space:pre-wrap}#caption{min-height:2em}#status{margin:12px 0}</style></head><body>
<header><strong>fanservice Viewer+</strong><a href="index.html">Library import</a><span id="source"></span></header><main><p id="status" role="status">Preparing local gameplay…</p><section id="stage"><img id="image" alt="Selected pack media"><video id="video" playsinline muted loop hidden></video></section><div id="beats"><span id="center"></span><span id="beat"></span></div><p id="caption" aria-live="polite"></p><progress id="meter" max="1" value="0" aria-label="Session meter"></progress><p id="stats"></p><audio id="audio" controls preload="metadata" hidden></audio>
<div id="controls"><button id="start">Start</button><button id="pause" disabled>Pause</button><button id="tap" disabled>Draw / Space</button><button id="draw" disabled>Next media</button><button id="finish" disabled>Finish / Enter</button><button id="end">End session</button></div><label>Difficulty<select id="difficulty"><option value="0">Easy</option><option value="1" selected>Normal</option><option value="2">Insane</option></select></label><label>Media pool<select id="pool"><option>slow</option><option>medium</option><option>fast</option><option>succubus</option><option>cum</option><option>ass</option><option>boobs</option></select></label><pre id="summary"></pre></main><script src="store.js"></script><script src="model.js"></script><script src="rules.js"></script><script src="inventory.js"></script><script src="items.js"></script><script src="objectives.js"></script><script src="tower.js"></script><script src="modifiers.js"></script><script src="economy.js"></script><script src="run.js"></script><script src="progression.js"></script><script src="voice.js"></script><script src="play.js"></script></body></html>
