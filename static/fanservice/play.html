<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151c27"><title>fanservice Viewer+</title><script src="media.js"></script><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="kenney.css"><link rel="stylesheet" href="presentation.css"><link rel="stylesheet" href="play.css"></head><body data-session-state="setup">
<header><strong>fanservice Viewer+</strong><a href="index.html">Library import</a><span id="source"></span></header><main>
  <section id="pre-session" aria-label="Session setup">
    <p id="setup-intro">Choose your session settings, then start playing.</p>
    <button id="start">Start</button>
    <label>Difficulty<select id="difficulty"><option value="0">Easy</option><option value="1" selected>Normal</option><option value="2">Insane</option></select></label>
  </section>
  <section id="gameplay" aria-label="Gameplay">
    <div id="gameplay-stage">
      <div id="session-background" aria-hidden="true"><img id="background-image" alt=""><video id="background-video" muted playsinline loop hidden></video></div>
      <div id="stage" tabindex="0" role="button" aria-label="Media. Tap to pause. Hold one second to finish when eligible."><img id="image" alt="Selected pack media"><video id="video" playsinline muted loop hidden></video></div>
      <svg id="finish-ring" viewBox="0 0 64 64" width="64" height="64" aria-hidden="true" hidden><circle class="ring-track" cx="32" cy="32" r="27"/><circle class="ring-progress" cx="32" cy="32" r="27" pathLength="1"/></svg>
      <div id="session-hud">
        <div id="hud-top"><div id="item-controls" role="group" aria-label="Equipped items" hidden></div><div id="controls"><button id="pause" aria-label="Pause" disabled>Pause</button><button id="tap" disabled>Draw / Space</button><button id="draw" disabled>Next media</button><button id="finish" aria-keyshortcuts="Enter Space" disabled>Hold to finish</button><button id="end">End session</button></div></div>
        <div id="hud-bottom"><p id="caption" aria-live="polite"></p><p id="voice-status" role="status"></p><p id="status" role="status">Preparing local gameplay…</p><progress id="meter" max="1" value="0" aria-label="Session meter"></progress><div id="beats"><span id="center"></span><span id="beat" class="beat-ball" aria-hidden="true" hidden></span></div></div>
      </div>
    </div>
  </section>
  <details id="session-statistics"><summary>Detailed statistics</summary><p id="stats"></p><p id="background-status">Background: Normal procedural preset.</p></details>
  <audio id="audio" preload="metadata" hidden></audio>
  <pre id="summary"></pre>
</main>
<dialog id="pause-menu" aria-labelledby="pause-menu-title"><h2 id="pause-menu-title">Pause menu</h2><div id="pause-menu-body"></div><button id="resume-session" type="button">Resume</button></dialog>
<script src="store.js"></script><script src="model.js"></script><script src="rules.js"></script><script src="inventory.js"></script><script src="items.js"></script><script src="objectives.js"></script><script src="tower.js"></script><script src="modifiers.js"></script><script src="economy.js"></script><script src="cards.js"></script><script src="edge.js"></script><script src="session_metrics.js"></script><script src="run.js"></script><script src="progression.js"></script><script src="voice.js"></script><script src="background.js"></script><script src="vibration.js"></script><script src="session_presets.js"></script><script src="beat_lane.js"></script><script src="media_selection.js"></script><script src="spawn_eligibility.js"></script><script src="play.js"></script></body></html>
