name: Curator release artifacts

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Preserve diagnostics from native builds and startup smoke tests. Curator's
# runtime logger honours RUST_LOG and already defaults to debug for local use;
# setting it here makes CI failures self-contained in the Actions log.
env:
  RUST_LOG: debug
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Native UI libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - name: Server browser tests
        run: |
          node --test tests/*.test.js
          node --check static/oobe.js

  windows:
    needs: validate
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - package: curator
            edition: server
            binary: curator
            artifact: curator.exe
          - package: curator-desktop
            edition: host
            binary: Curator
            artifact: Curator.exe
          - package: curator-viewer
            edition: viewer
            binary: curator-viewer
            artifact: curator-viewer.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Curator ${{ matrix.edition }} with verbose diagnostics
        run: cargo build -vv --release --locked -p ${{ matrix.package }} --bin ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: curator-${{ matrix.edition }}-windows
          path: target/release/${{ matrix.artifact }}

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Native UI libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native editions with verbose diagnostics
        run: cargo build -vv --release --locked --workspace
      - name: Build Debian packages and portable archives
        run: |
          mkdir -p packages
          sh packaging/linux/build-server-deb.sh target/release/curator packages
          sh packaging/linux/build-host-deb.sh target/release/Curator packages
          sh packaging/linux/build-viewer-deb.sh target/release/curator-viewer packages
      - uses: actions/upload-artifact@v4
        with:
          name: curator-packages-linux
          path: |
            packages/*.deb
            packages/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: curator-server-linux
          path: target/release/curator
      - uses: actions/upload-artifact@v4
        with:
          name: curator-host-linux
          path: target/release/Curator
      - uses: actions/upload-artifact@v4
        with:
          name: curator-viewer-linux
          path: target/release/curator-viewer

  bundle-tools:
    # Fetch and checksum-verify the Windows Host helper tools (ffmpeg,
    # ffprobe, mpv, gallery-dl). Fails loudly on missing URLs or checksum
    # mismatches so packaging never ships a partial bundle. The manifest
    # URLs are maintainer-verified starting points; this job stays red until
    # they are confirmed against real release artifacts.
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch helper tools
        shell: bash
        run: |
          sh packaging/bundles/fetch-tools.sh "$RUNNER_TEMP/curator-tools"
      - uses: actions/upload-artifact@v4
        with:
          name: curator-host-tools-windows
          path: ${{ runner.temp }}/curator-tools

  windows-installers:
    needs: [windows, bundle-tools]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: curator-*-windows
          path: bins
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: curator-host-tools-windows
          path: host-tools
      - name: Install NSIS
        run: choco install nsis -y
      - name: Build Server installers
        shell: pwsh
        run: |
          ./packaging/windows/build-server-installers.ps1 `
            -ServerBinary ./bins/curator.exe `
            -OutputDirectory ./installers
      - name: Build Host and Viewer installers
        shell: pwsh
        run: |
          ./packaging/windows/build-desktop-installers.ps1 `
            -HostBinary ./bins/Curator.exe `
            -ViewerBinary ./bins/curator-viewer.exe `
            -ToolsDirectory ./host-tools `
            -OutputDirectory ./installers
      - uses: actions/upload-artifact@v4
        with:
          name: curator-installers-windows
          path: installers/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, windows-installers, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-artifacts/**
