name: Curator release artifacts

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Preserve diagnostics from native builds and startup smoke tests. Curator's
# runtime logger honours RUST_LOG; CI opts into debug for useful failure logs.
env:
  RUST_LOG: debug
  RUST_BACKTRACE: full
  CARGO_TERM_COLOR: always

jobs:
  dependency-security:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.92.0"
          command: check bans licenses sources
      - name: RustSec advisory audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - name: Check RustSec advisories
        run: cargo audit

  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Native UI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libfuse2
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - name: Server browser tests
        shell: bash
        run: node --test tests/*.test.js
      - run: node --check static/oobe.js
      - name: Worker protocol contract tests
        run: python -m unittest discover -s tests -p 'test_worker_*.py'

  windows:
    needs: validate
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - package: curator
            edition: server
            binary: curator
            artifact: curator.exe
          - package: curator-desktop
            edition: host
            binary: Curator
            artifact: Curator.exe
          - package: curator-viewer
            edition: viewer
            binary: curator-viewer
            artifact: curator-viewer.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Build Curator ${{ matrix.edition }} with verbose diagnostics
        run: cargo build -vv --release --locked -p ${{ matrix.package }} --bin ${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: curator-${{ matrix.edition }}-windows
          path: target/release/${{ matrix.artifact }}

  bundle-tools:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Archive tools
        run: sudo apt-get update && sudo apt-get install -y p7zip-full unzip
      - name: Verify pinned Windows runtime artifacts
        run: sh packaging/bundles/fetch-tools.sh staged-tools
      - uses: actions/upload-artifact@v4
        with:
          name: curator-verified-windows-tools
          path: staged-tools/

  windows-installers:
    needs: [windows, bundle-tools]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: curator-server-windows
          path: binaries/server
      - uses: actions/download-artifact@v4
        with:
          name: curator-host-windows
          path: binaries/host
      - uses: actions/download-artifact@v4
        with:
          name: curator-viewer-windows
          path: binaries/viewer
      - uses: actions/download-artifact@v4
        with:
          name: curator-verified-windows-tools
          path: staged-tools
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build Host and Viewer installers
        shell: pwsh
        run: ./packaging/windows/build-desktop-installers.ps1 -HostBinary binaries/host/Curator.exe -ViewerBinary binaries/viewer/curator-viewer.exe -ToolsDirectory staged-tools -OutputDirectory installers
      - name: Build Server installers
        shell: pwsh
        run: ./packaging/windows/build-server-installers.ps1 -ServerBinary binaries/server/curator.exe -OutputDirectory installers
      - name: Install, upgrade, uninstall, and preserve data
        shell: pwsh
        run: ./packaging/windows/smoke-desktop-installers.ps1 -InstallerDirectory installers
      - uses: actions/upload-artifact@v4
        with:
          name: curator-windows-installers
          path: installers/*.exe

  linux:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Native UI libraries
        run: sudo apt-get update && sudo apt-get install -y build-essential libfontconfig1-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libfuse2
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
      - name: Build native editions with verbose diagnostics
        run: cargo build -vv --release --locked --workspace
      - name: Build and inspect existing Debian and portable packages
        run: |
          sh packaging/linux/build-server-deb.sh target/release/curator linux-packages
          sh packaging/linux/build-host-deb.sh target/release/Curator linux-packages
          sh packaging/linux/build-viewer-deb.sh target/release/curator-viewer linux-packages
          for package in linux-packages/*.deb; do dpkg-deb --field "$package" Package Version; dpkg-deb --contents "$package" >/dev/null; done
          for archive in linux-packages/*.tar.gz; do tar -tzf "$archive" >/dev/null; done
      - uses: actions/upload-artifact@v4
        with:
          name: curator-linux-packages
          path: linux-packages/
      - uses: actions/upload-artifact@v4
        with:
          name: curator-server-linux
          path: target/release/curator
      - uses: actions/upload-artifact@v4
        with:
          name: curator-host-linux
          path: target/release/Curator
      - uses: actions/upload-artifact@v4
        with:
          name: curator-viewer-linux
          path: target/release/curator-viewer

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dependency-security, windows-installers, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: curator-*-windows
          path: release-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: curator-*-linux
          path: release-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: curator-linux-packages
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: curator-windows-installers
          path: release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: release-artifacts/**
