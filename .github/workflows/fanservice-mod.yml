name: fanservice mod compatibility and export

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate build registry and fail-closed identification
        run: |
          python -m unittest discover -s tests -p 'test_fanservice_mod.py'
          python -m unittest discover -s tests -p 'test_v004_pack_bridge.py'
          python -m unittest discover -s tests -p 'test_v004_runtime_installer.py'
          python mod/verify_compatibility.py > mod-readiness.json
          node --test tests/fanservice_chpack.test.js tests/fanservice_archive_save.test.js
          node --test tests/fanservice-native-bridge.test.cjs tests/fanservice-native-ownership.test.cjs
      - name: Validate packaged-game MCP transport
        run: |
          npm ci --prefix mod/mcp
          npm test --prefix mod/mcp
      - name: Validate native companion and Lua transport contracts
        run: |
          npm ci --prefix mod/native
          npm test --prefix mod/native
      - name: Publish compatibility status, not a game or mod installer
        uses: actions/upload-artifact@v4
        with:
          name: fanservice-mod-readiness
          path: |
            mod-readiness.json
            mod/compatibility.json
            mod/README.md
            mod/evidence/
