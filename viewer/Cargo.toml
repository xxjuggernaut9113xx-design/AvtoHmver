[package]
name = "curator-viewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Curator Tailnet Viewer"
publish = false

[[bin]]
name = "curator-viewer"
path = "src/main.rs"

[build-dependencies]
# Build-time compiler and runtime must stay on the same Slint release because
# generated component ABI is not guaranteed across Slint versions.
slint-build = "=1.18.0"

[dependencies]
curator = { path = ".." }
curator-desktop = { path = "../desktop" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# Keep exactly aligned with slint-build above.
slint = "=1.18.0"
dirs = "5"
